x-airflow-common: &airflow-common
  build: .
  env_file: .env
  # Match the host UID so bind-mounted companies.yaml (and logs/output) are
  # writable. AIRFLOW_UID is set in .env; the :0 group is the Airflow image's
  # documented pattern so /opt/airflow stays writable.
  user: "${AIRFLOW_UID:-1000}:0"
  environment:
    &airflow-common-env
    AIRFLOW_CONN_SUPABASE_DB: 'postgresql://${SUPABASE_USER}:${SUPABASE_PASSWORD}@${SUPABASE_HOST}:${SUPABASE_PORT}/${SUPABASE_DB}?sslmode=require'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./output:/opt/airflow/output
    - ./tests:/opt/airflow/tests
    - ./companies.yaml:/opt/airflow/companies.yaml
    # dbt project (models, tests, profiles.yml). dbt itself is installed in an
    # isolated venv baked into the image (see dockerfile). dbt writes its
    # target/ and logs/ to /tmp at runtime, so this mount is only read.
    - ./dbt:/opt/airflow/dbt:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5478:5432"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        chmod u+w /opt/airflow/companies.yaml 2>/dev/null || true
        airflow db migrate
        airflow users create \
          --username $${_AIRFLOW_WWW_USER_USERNAME} \
          --password $${_AIRFLOW_WWW_USER_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    depends_on:
      postgres:
        condition: service_healthy

  webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  worker:
    <<: *airflow-common
    command: airflow celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
